name: PP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-data:
    name: Validate data models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run validate
      - run: npm run validate:course-builder
      - run: npm run validate:backup-manager
      - run: npm run validate:course-engine-v2
      - run: npm run validate:course-builder
      - run: npm run validate:source-grounded-mcq
      - run: npm run validate:selection-engine
      - run: npm run validate:source-grounded-mcq
      - run: npm run validate:pyq-retention
      - run: npm run validate:selection-loop-v2
      - run: npm run validate:external-evidence
      - run: npm run validate:evidence-pipeline
      - run: npm run validate:trusted-sources

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  repository-smoke:
    name: Repository smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node -e "const p=require('./package.json'); if(!p.scripts.build||!p.scripts.validate) process.exit(1); console.log('Package scripts OK')"

  source-tree-check:
    name: Source tree check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run validate
