name: PP CI

on:
  push:
    branches: [main, source-grounded-engine-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-data:
    name: Validate data models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run validate

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm build

  repository-smoke:
    name: Repository smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node -e "const p=require('./package.json'); if(!p.scripts.build||!p.scripts.validate) process.exit(1); console.log('Package scripts OK')"

  source-tree-check:
    name: Source tree check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run validate
