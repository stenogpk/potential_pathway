name: PP Final Selection Validation

on:
  push:
    branches: [main, feature/final-selection-workflow-v1]
  pull_request:
    branches: [main]

jobs:
  validate-final-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run validate:final-selection
      - run: npm run build
